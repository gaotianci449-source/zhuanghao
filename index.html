<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2124">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="桩号">
<title>桩号</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="readout" id="readout">
  <div class="readout-top">
    <button class="road-chip" id="roadChip" type="button" aria-haspopup="dialog">
      <span class="swatch" id="roadSwatch"></span><span id="roadName">还没有路段</span><span class="caret" aria-hidden="true"></span>
    </button>
    <span class="acc" id="acc" data-level="none">未定位</span>
  </div>
  <div class="ch" id="ch" aria-live="polite">—</div>
  <div class="off" id="off">导入路段后，这里显示你所在的桩号</div>
</header>

<main id="map" aria-label="地图"></main>

<button class="locate" id="locate" type="button" aria-pressed="false" title="定位并跟随">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" fill="none"/></svg>
  <span class="sr">定位</span>
</button>

<nav class="bar" aria-label="主菜单">
  <button type="button" data-sheet="find"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h9l1 2h4v9h-7l-1-2H7"/></svg>找桩号</button>
  <button type="button" data-sheet="roads"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 5 21M16 3l3 18M12 4v3M12 10v3M12 16v4"/></svg>路段</button>
  <button type="button" data-sheet="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>更多</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button type="button" class="close" id="sheetClose" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="fileRoad" accept=".kml,.kmz,.txt,.csv,.dat,.xyz" hidden>
<input type="file" id="fileBackup" accept=".json,application/json" hidden>

<script src="vendor/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
